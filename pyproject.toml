[project]
name = "localimgsearch"
version = "1.0.0"
description = "Local AI image search with CLIP - search your photos with text or images"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.10.0",
    "transformers>=5.2.0",
    "pillow>=9.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "aiofiles>=23.0.0",
    "tqdm>=4.65.0",
    "numpy>=1.24.0",
    "chromadb>=0.6.0",
    "torchvision>=0.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=23.0.0", "ruff>=0.1.0"]
rerank = ["sentence-transformers>=5.0.0"]

[project.scripts]
localimg = "localimgsearch.cli:main"
localimgsearch = "localimgsearch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localimgsearch"]

[tool.hatch.build.targets.sdist]
include = ["/localimgsearch", "/templates", "/README.md"]

# PyTorch CUDA 12.6 index
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
